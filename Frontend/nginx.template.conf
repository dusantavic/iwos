server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Match Backend FileSizeLimit (52,428,800 bytes = 50 MiB) so uploads don't get
  # rejected at the edge before reaching the API.
  client_max_body_size 50m;

  # ── Security headers ──────────────────────────────────────────────────────
  # HSTS: only effective when served over HTTPS, but always-on is safe — browsers
  # ignore the header on plain HTTP. preload eligibility requires includeSubDomains.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP: same-origin defaults. 'unsafe-inline' on style is required by libraries
  # that inject runtime styles (react-day-picker, react-select). frame-ancestors
  # supersedes X-Frame-Options on modern browsers.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  # Serve SPA
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API to backend (single-domain deploy)
  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Proxy uploaded asset paths (profile pics, files) to backend so the SPA can
  # use relative `/uploads/...` URLs without depending on a separate asset host.
  location /uploads/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
